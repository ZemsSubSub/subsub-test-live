<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared with you — SubSub</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Публичная страница получателя шаренной ссылки (незалогиненный), тип: ВИДЕО.
       Net-new — в реальном продукте такой страницы нет. Один тип файла на страницу. -->
  <div class="pub">

    <!-- Лёгкий брендированный шелл: только лого + «Sign up free» (без сайдбара/меню) -->
    <header class="pub__header">
      <a class="pub__logo" href="#" aria-label="SubSub"><img src="icons/subsublogo.webp" alt="SubSub" /></a>
      <a class="pub-signup" href="#">Sign up free</a>
    </header>

    <main class="pub__main">

      <!-- Атрибуция: кто и из какой организации поделился -->
      <div class="pub__attr">
        <span>Shared by</span>
        <span class="pub__attr-avatar" style="background:var(--color-avatar-0)">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12.2a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2Z"/><path d="M4.8 19.2c0-3.05 3.23-4.9 7.2-4.9s7.2 1.85 7.2 4.9V20H4.8v-.8Z"/></svg>
        </span>
        <span><strong>Yevhenii Zemskov</strong> from GenTech</span>
      </div>

      <!-- VIDEO: светлый хедер превьюера + кастомный плеер -->
      <div class="pub-card" data-type="video">
        <div class="ml-viewer__head">
          <span class="ml-viewer__badge ml-viewer__badge--video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9.5l4.5 2.5-4.5 2.5z" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="ml-viewer__title">video_2026-07-10_12-44-13_original.mp4</span>
          <div class="ml-viewer__actions">
            <a class="pub-download" href="files/sample-video.webm" download>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg>Download
            </a>
          </div>
        </div>
        <div class="ml-viewer__body--dark pub-video-body">
          <div class="ml-video">
            <video class="ml-video-el" playsinline preload="metadata" src="files/sample-video.webm"></video>
            <div class="ml-video__bar">
              <button type="button" data-vplay aria-label="Play/Pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
              <button type="button" data-vback aria-label="Rewind 10s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6 5 12l6 6zM18 6l-6 6 6 6z"/></svg></button>
              <button type="button" data-vfwd aria-label="Forward 10s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6l6 6-6 6zM6 6l6 6-6 6z"/></svg></button>
              <div class="ml-video__track" data-vtrack><div class="fill" data-vfill></div><div class="dot" data-vdot></div></div>
              <span class="ml-video__time" data-vtime>0:00 / 0:00</span>
              <button type="button" data-vmute aria-label="Mute"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
              <div class="ml-video__vol" data-vvol><div class="fill" data-vvolfill></div></div>
              <button type="button" data-vfull aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Промо-баннер: приглашение зарегистрироваться -->
      <div class="pub-cta">
        <p class="pub-cta__text">Want your own creator tools? Get started with SubSub for free</p>
        <a class="pub-cta__btn" href="#">Sign up</a>
      </div>

    </main>
  </div>

  <script src="js/player.js"></script>
</body>
</html>
